services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - db_data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/monitoring.db
      - AWS_REGION=eu-west-1
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN}
      - EC2_HOST=${EC2_HOST}
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
