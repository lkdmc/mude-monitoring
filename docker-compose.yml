services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - db_data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/monitoring.db
      - AWS_REGION=eu-west-1
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
