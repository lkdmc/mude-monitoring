# Host nginx reverse proxy for the MUDE monitor on edu01.
#
# edu01's root already serves another site, so this is a NAME-BASED virtual
# host: it only handles requests for mude-monitoring.citg.tudelft.nl and proxies
# them to the Docker frontend on localhost:3000. The existing site is untouched.
#
# Install:
#   sudo cp school/deploy/nginx-mude-monitoring.conf \
#           /etc/nginx/sites-available/mude-monitoring
#   sudo ln -s /etc/nginx/sites-available/mude-monitoring \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (certbot rewrites this file to add the 443 block
# and an HTTP->HTTPS redirect automatically):
#   sudo certbot --nginx -d mude-monitoring.citg.tudelft.nl

server {
    listen 80;
    listen [::]:80;
    server_name mude-monitoring.citg.tudelft.nl;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
